<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指令大全 C 第二轮打磨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #F7F7F8; --panel: #FFFFFF; --side: #F0F0F2; --line: #E4E4E8; --text: #18181B; --muted: #5F5F68;
    --accent: #D6336C; --accent-hover: #C42A60; --on-accent: #FFFFFF; --accent-soft: #FDECF2; --accent-text: #B32457;
    --field: #FFFFFF; --field-line: #8A8A93; --hover: #E7E7EA; --cur: #FFFFFF; --off: #C9C9CF; --leaf: #1A7A43;
    --row-hover: #EFEFF2; --mark: #FFE7A3; --shadow-sm: 0 1px 2px rgba(24,24,27,.06);
    --dc-bg: #FFFFFF; --dc-deep: #F2F3F5; --dc-input: #EBEDEF; --dc-slot: #DFE1E5; --dc-line: #E3E5E8; --dc-text: #313338; --dc-muted: #5C5E66; --dc-name: #060607;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --display: "Fredoka", var(--font);
}
html[data-theme="dark"] {
    --bg: #17171B; --panel: #1F1F24; --side: #121215; --line: #2C2C33; --text: #EDEDF0; --muted: #9A9AA5;
    --accent: #FF6FA3; --accent-hover: #FF8DB7; --on-accent: #2A0A17; --accent-soft: #3A1A28; --accent-text: #FF8DB7;
    --field: #17171B; --field-line: #6A6A74; --hover: #1E1E23; --cur: #26262C; --off: #3A3A42; --leaf: #3DD68C;
    --row-hover: #1F1F25; --mark: #5A4512; --shadow-sm: none;
    --dc-bg: #313338; --dc-deep: #2B2D31; --dc-input: #383A40; --dc-slot: #4E5058; --dc-line: #3F4147; --dc-text: #DBDEE1; --dc-muted: #B5BAC1; --dc-name: #F2F3F5;
}
* { box-sizing: border-box; }
html[data-lang="zh"] [data-l="en"], html[data-lang="en"] [data-l="zh"] { display: none; }
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ── 试装页自己的按钮，不是设计的一部分 ── */
.demo { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; gap: 6px; align-items: center; background: #18181B; color: #FAFAFA; border-radius: 10px; padding: 6px 8px 6px 12px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.demo button { border: 1px solid #3F3F46; background: transparent; color: #FAFAFA; border-radius: 6px; padding: 3px 10px; cursor: pointer; }

/* ── 顶部导航（和首页一样） ── */
.nav { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.nav-in { max-width: 1180px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; margin-right: auto; white-space: nowrap; }
.brand img { width: 34px; height: 34px; border-radius: 50%; }
.nav-link { font-weight: 600; font-size: 15px; color: var(--muted); background: none; border: 0; padding: 8px 12px; border-radius: 8px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.nav-link:hover { color: var(--text); background: var(--hover); }
.nav-link[aria-current] { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); }

/* ── 宽屏左侧栏（和首页一样，频道换成指令分组） ── */
.side { display: none; }
.rail { width: 72px; flex-shrink: 0; background: var(--hover); padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rail a { position: relative; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); text-decoration: none; transition: border-radius .15s, background .15s; }
.rail a:hover, .rail a.home { border-radius: 16px; }
.rail a:hover { background: var(--accent); color: var(--on-accent); }
.rail a.home::before { content: ''; position: absolute; left: -12px; top: 4px; width: 4px; height: 40px; border-radius: 0 4px 4px 0; background: var(--text); }
.rail img { width: 48px; height: 48px; border-radius: inherit; }
.rail svg { width: 22px; height: 22px; }
.rail .sep { width: 32px; height: 2px; background: var(--off); border-radius: 1px; }
.chan { flex: 1; min-width: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.chan-head { height: 64px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; font-weight: 700; border-bottom: 1px solid var(--line); }
.chan-cat { font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 20px 16px 6px; }
.chan a { display: flex; align-items: center; gap: 8px; margin: 1px 8px; padding: 7px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 15px; }
.chan a .h { opacity: .7; font-weight: 700; width: 12px; }
.chan a .n { margin-left: auto; font-size: 12.5px; opacity: .8; }
.chan a:hover { background: var(--hover); color: var(--text); }
.chan a.on { background: var(--cur); color: var(--text); box-shadow: var(--shadow-sm); }
@media (min-width: 1440px) {
    body { padding-left: 312px; }
    .side { display: flex; position: fixed; top: 0; bottom: 0; left: 0; width: 312px; z-index: 60; }
    .nav .brand { display: none; }
    .nav-in { justify-content: flex-end; max-width: 1320px; }
    .wrap { max-width: 1320px; }
}

/* ── 页面 ── */
.wrap { max-width: 1180px; margin: 0 auto; padding: 44px 24px 96px; }
.head h1 { font: 600 40px/1.15 var(--display); margin: 0 0 8px; }
.head p { margin: 0; color: var(--muted); font-size: 15px; max-width: 56ch; }
.grid { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; align-items: start; }

.search { position: sticky; top: 76px; z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--field); border: 1px solid var(--field-line); border-radius: 12px; padding: 0 8px 0 14px; height: 48px; box-shadow: 0 0 0 6px var(--bg), 0 -12px 0 6px var(--bg); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 6px var(--bg), 0 -12px 0 6px var(--bg); }
.search .slash { font: 600 19px var(--display); color: var(--muted); }
.search input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 16px; color: var(--text); min-width: 0; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
.search .clear:hover { background: var(--hover); color: var(--text); }
.found { margin: 10px 0 0; font-size: 14px; color: var(--muted); min-height: 1.6em; }

#list { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; }
.sec { scroll-margin-top: 140px; grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
.sec-head, .empty { grid-column: 1 / -1; }
.sec-head { margin: 28px 0 8px; }
.sec-head h2 { font: 600 19px var(--display); margin: 0; display: flex; align-items: baseline; gap: 8px; }
.sec-head h2 small { font: 500 14px var(--font); color: var(--muted); }
.sec-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.sec-head p b { color: var(--text); font-weight: 600; }
.rows { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; border-top: 1px solid var(--line); }
.row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; gap: 16px; align-items: center; padding: 10px 12px; margin: 0 -12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; position: relative; }
.row:hover { background: var(--row-hover); }
.row[aria-selected="true"] { background: var(--accent-soft); }
.row[aria-selected="true"]::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.cmd { font-weight: 700; white-space: nowrap; }
.cmd .pre { color: var(--muted); font-weight: 600; }
.row .desc { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row[aria-selected="true"] .desc { color: var(--text); }
.row .perm { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.empty { padding: 24px 0; color: var(--muted); display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; align-items: center; }
.empty-stk { width: 88px; height: 88px; object-fit: contain; }
.empty .sugg { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.empty .sugg button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.empty .sugg button:hover { border-color: var(--field-line); }

/* ── 右侧详情 ── */
.panel { position: sticky; top: 88px; display: grid; gap: 18px; max-height: calc(100vh - 104px); overflow-y: auto; overscroll-behavior: contain; padding: 0 6px 12px 0; margin-right: -6px; scrollbar-width: thin; }
.panel h3 { margin: 0; font: 600 24px/1.2 var(--display); overflow-wrap: anywhere; }
.panel .lead { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.who { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.who b { color: var(--text); font-weight: 600; }
.who svg { width: 15px; height: 15px; flex: none; }
.inline-panel { display: none; }

/* Discord 输入框：整页唯一放胆的地方 */
.dcm { background: var(--dc-bg); color: var(--dc-text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow-sm); }
.dcm-pop { background: var(--dc-deep); border-radius: 8px; padding: 10px 12px 12px; margin-bottom: 8px; font-size: 14px; }
.dcm-app { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--dc-muted); margin-bottom: 6px; }
.dcm-app img { width: 16px; height: 16px; border-radius: 50%; }
.dcm-opt b { color: var(--dc-name); font-weight: 700; }
.dcm-opt .need { font-size: 12.5px; color: var(--dc-muted); margin-left: 6px; }
.dcm-opt span.d { display: block; color: var(--dc-muted); margin-top: 1px; }
.dcm-in { background: var(--dc-input); border-radius: 8px; padding: 9px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; min-height: 44px; }
.dcm-in .c { font-weight: 700; color: var(--dc-name); margin-right: 2px; }
.slot { display: inline-flex; align-items: center; background: var(--dc-slot); border-radius: 4px; padding: 1px 7px; font-size: 14px; color: var(--dc-name); transition: box-shadow .12s; }
.slot::after { content: ':'; color: var(--dc-muted); margin-left: 1px; }
.slot.on { box-shadow: 0 0 0 2px var(--accent); }
.more { font-size: 12.5px; color: var(--dc-muted); padding: 1px 4px; }

.block h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
.params { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.params button { width: 100%; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; font-size: 14px; }
.params button:hover .pn, .params button.on .pn { color: var(--accent-text); }
.pn { font-weight: 600; }
.pn .tag { font-weight: 500; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.pd { color: var(--muted); }
.ex { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 15px; }
.ex li { padding: 3px 0 3px 12px; border-left: 2px solid var(--line); overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.copy { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--field-line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.copy:hover { border-color: var(--accent); color: var(--accent-text); }
.copy svg { width: 15px; height: 15px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.note b { color: var(--text); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; transition: .18s; pointer-events: none; z-index: 95; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 窄屏：详情展开在选中的那一行下面 */
@media (max-width: 1079px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .panel { display: none; }
    .inline-panel { display: grid; gap: 18px; grid-column: 1 / -1; padding: 6px 0 22px; border-bottom: 1px solid var(--line); }
    .inline-panel h3 { display: none; }
    .inline-panel .lead { display: none; }
}
@media (max-width: 640px) {
    .wrap { padding: 28px 16px 80px; }
    .head h1 { font-size: 32px; }
    .nav-in { padding: 0 12px; gap: 2px; }
    .brand span { display: none; }
    .nav-link { padding: 8px; }
    .nav .btn { padding: 8px 12px; }
    #list { grid-template-columns: minmax(0, 1fr); }
    .row { gap: 2px; }
    .row .desc { white-space: normal; }
    .row .perm { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
</style>
</head>

        <a href="#" class="home"><img src="/files/rin-avatar.png" alt="小凛 RinBot"></a>

<nav class="nav"><div class="nav-in">

<main class="wrap">
