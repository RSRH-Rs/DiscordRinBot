<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr('error.title') }} · 小凛 Rin</title>
    <script>try{var t=localStorage.getItem('rin-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="shortcut icon" href="{{ url_for('static', filename='rin_bot_web_icon.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" onload="this.rel='stylesheet'">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/console.css') }}?v=20261108b">
</head>
<body class="gate-body">
<main class="gate">
    <img class="gate-art" src="{{ url_for('static', filename='images/rin/error.png') }}" alt="" width="160" height="160" decoding="async">
    <h1>{{ tr('error.heading') }}</h1>
    <p>{{ tr('error.body') }}</p>
    <pre class="gate-error">{{ error }}</pre>
    <div class="gate-actions">
        <a class="btn btn--primary" href="/">{{ tr('error.home') }}</a>
        <a class="btn btn--secondary" href="/login">{{ tr('error.login') }}</a>
    </div>
</main>
</body>
</html>
