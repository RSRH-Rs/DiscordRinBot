<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出错了 | 小凛 Rin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box; }
        body { font-family:'Nunito',sans-serif; background:#FDF8F4; color:#5A4A42; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
        .box { width:100%; max-width:488px; padding:32px 24px; }
        .error-art { display:block; width:200px; max-width:60vw; height:auto; margin:0 auto 16px; }
        h1 { font-size:1.5rem; font-weight:800; margin-bottom:10px; }
        p  { font-size:0.9rem; color:#888; line-height:1.7; margin-bottom:6px; }
        .err { background:#fff; border:1px solid #EAEAEA; border-radius:10px; padding:12px 16px; font-family:monospace; font-size:0.8rem; color:#c0566a; text-align:left; margin:20px 0; word-break:break-all; }
        .actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
        a { display:inline-flex; align-items:center; gap:10px; margin-top:8px; padding:11px 22px; background:#5A4A42; color:#fff; border-radius:50px; font-weight:800; font-size:0.9rem; text-decoration:none; transition:.2s; }
        a.secondary { background:#fff; color:#5A4A42; border:1px solid #EAE0DA; }
        a svg { width:18px; height:18px; flex-shrink:0; }
        a:hover { background:#FFB7C5; color:#5A4A42; }
        a:focus-visible { outline:2px solid #C0566A; outline-offset:4px; }
    </style>
</head>
<body>
    <div class="box">
        <img class="error-art" src="{{ url_for('static', filename='images/rin/error.png') }}" alt="" width="200" height="200" decoding="async">
        <h1>糟糕，刚才没能打开页面…</h1>
        <p>可以先回首页看看，或重新登录后再试一次。</p>
        <div class="err">{{ error }}</div>
        <div class="actions">
            <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12H5m6-6-6 6 6 6"/></svg>返回首页</a>
            <a class="secondary" href="/login">重新登录<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></a>
        </div>
    </div>
</body>
</html>
